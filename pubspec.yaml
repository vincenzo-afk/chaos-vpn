name: chaosvoice
description: Real-time system-wide voice changer with 10-layer DSP engine.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Audio capture — raw PCM 16-bit mono stream
  flutter_voice_processor: ^1.2.1

  # DSP effects engine — reverb, echo, pitch
  flutter_soloud: ^2.0.0

  # Background audio service
  audio_service: ^0.18.12

  # Android foreground service with persistent notification
  flutter_foreground_task: ^6.1.3

  # Permissions
  permission_handler: ^11.3.0

  # Local notifications (foreground notification)
  flutter_local_notifications: ^17.1.2

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.4

  # Utilities
  logger: ^2.3.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.9
  freezed: ^2.5.2
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
